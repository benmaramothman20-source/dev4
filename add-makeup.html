
<div class="container">
    <div>
        <h2>Ajouter un Makeup :</h2>
    </div>

    <form>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>ID Makeup</label>
            <input type="number" [(ngModel)]="newMakeup.idMakeup"
                name="idMakeup" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Makeup</label>
            <input type="text" [(ngModel)]="newMakeup.nomMakeup"
                name="nomMakeup" class="form-control">
        </div>

        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Prix Makeup</label>
            <input type="number" [(ngModel)]="newMakeup.prix"
                name="prix" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date création</label>
            <input type="date" [(ngModel)]="newMakeup.dateCreation"
                name="dateCreation" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Categorie</label>
            <select class="form-control form-control-lg" id="idCat" name="idCat" [(ngModel)]="newIdCat">
                @for(cat of categories; track cat.idCat){
                <option [value]="cat.idCat"> {{cat.nomCat}} </option>
                }
            </select>
        </div>

        <div class="mt-2">
            <button type="button" (click)="addMakeup()"
                class="btn btn-success">
                Ajouter
            </button>
        </div>

        <div class="mt-2">
            <h3>{{ message }}</h3>
        </div>

    </form>
</div>
